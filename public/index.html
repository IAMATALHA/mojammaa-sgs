<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mojammaa Al Maarifa</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAF8F5;
      color: #1D3557;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 8px 30px rgba(29, 53, 87, 0.10);
      text-align: center;
    }
    .logo { width: 110px; height: 110px; object-fit: contain; margin-bottom: 16px; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p.sub { color: rgba(29, 53, 87, 0.65); font-size: 0.92rem; margin: 0 0 26px; line-height: 1.5; }
    .links { display: flex; flex-direction: column; gap: 10px; }
    a.btn {
      display: block;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
    }
    a.btn.primary { background: #1D3557; color: #FFFFFF; }
    a.btn.secondary { background: #FFFDFC; color: #1D3557; border: 1px solid rgba(29, 53, 87, 0.18); }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="Mojammaa Al Maarifa" />
    <h1>Mojammaa Al Maarifa</h1>
    <p class="sub">Établissement d'enseignement privé — préscolaire, primaire, collège.<br />Application Mojammaa Connect pour parents, enseignants et administration.</p>
    <div class="links">
      <a class="btn primary" href="https://play.google.com/store/apps/details?id=com.youssefatalha.mojammaasgs">Télécharger l'application (Android)</a>
      <a class="btn secondary" href="/privacy">Politique de confidentialité</a>
    </div>
  </div>
</body>
</html>
