<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Réinitialiser le mot de passe — Mojammaa Al Maarifa</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAF8F5;
      color: #1D3557;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #FFFFFF;
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 8px 30px rgba(29, 53, 87, 0.10);
      text-align: center;
    }
    .logo { width: 96px; height: 96px; object-fit: contain; margin-bottom: 12px; }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    p.sub { color: rgba(29, 53, 87, 0.65); font-size: 0.9rem; margin: 0 0 24px; }
    p.email { font-weight: 700; margin: -16px 0 24px; word-break: break-all; }
    label { display: block; text-align: left; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
    .field { position: relative; margin-bottom: 14px; }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px 42px 12px 14px;
      border: 1px solid rgba(29, 53, 87, 0.18);
      border-radius: 10px;
      font-size: 1rem;
      background: #FFFDFC;
      color: #1D3557;
      outline: none;
    }
    input:focus { border-color: #FF8C42; }
    .toggle {
      position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: rgba(29, 53, 87, 0.5);
      font-size: 0.8rem; font-weight: 700; padding: 4px;
    }
    button.submit {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      background: #1D3557;
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button.submit:disabled { opacity: 0.6; cursor: not-allowed; }
    button.submit:not(:disabled):hover { background: #16304F; }
    .msg { font-size: 0.88rem; border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; text-align: left; }
    .msg.error { background: rgba(217, 83, 79, 0.10); color: #B3261E; }
    .msg.success { background: rgba(76, 175, 80, 0.12); color: #2E7D32; }
    .hint { font-size: 0.78rem; color: rgba(29, 53, 87, 0.55); text-align: left; margin: -6px 0 16px; }
    .center-state { padding: 12px 0 4px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="Mojammaa Al Maarifa" />
    <h1>Réinitialiser le mot de passe</h1>
    <p class="sub" id="subtitle">Chargement…</p>

    <div id="content"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getAuth, verifyPasswordResetCode, confirmPasswordReset,
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCULKNSmhrLStX8eEeUZF83Fu89uQJBB4",
      authDomain: "mojammaa-sgs.firebaseapp.com",
      projectId: "mojammaa-sgs",
      storageBucket: "mojammaa-sgs.firebasestorage.app",
      messagingSenderId: "21853485219",
      appId: "1:21853485219:web:8e1689fc7a782173882716",
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const subtitle = document.getElementById('subtitle');
    const content = document.getElementById('content');
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode');
    const oobCode = params.get('oobCode');

    function renderError(text) {
      subtitle.textContent = "";
      content.innerHTML = `<div class="msg error">${text}</div>`;
    }

    function renderForm(email) {
      subtitle.textContent = "";
      content.innerHTML = `
        <p class="email">${email}</p>
        <form id="resetForm">
          <label for="pw1">Nouveau mot de passe</label>
          <div class="field">
            <input type="password" id="pw1" minlength="6" required autocomplete="new-password" />
            <button type="button" class="toggle" data-target="pw1">Afficher</button>
          </div>
          <label for="pw2">Confirmer le mot de passe</label>
          <div class="field">
            <input type="password" id="pw2" minlength="6" required autocomplete="new-password" />
            <button type="button" class="toggle" data-target="pw2">Afficher</button>
          </div>
          <p class="hint">Minimum 6 caractères.</p>
          <div id="formMsg"></div>
          <button type="submit" class="submit" id="submitBtn">Enregistrer</button>
        </form>
      `;

      document.querySelectorAll('.toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const input = document.getElementById(btn.dataset.target);
          const showing = input.type === 'text';
          input.type = showing ? 'password' : 'text';
          btn.textContent = showing ? 'Afficher' : 'Masquer';
        });
      });

      document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw1 = document.getElementById('pw1').value;
        const pw2 = document.getElementById('pw2').value;
        const formMsg = document.getElementById('formMsg');
        const submitBtn = document.getElementById('submitBtn');
        formMsg.innerHTML = '';

        if (pw1.length < 6) {
          formMsg.innerHTML = '<div class="msg error">Le mot de passe doit comporter au moins 6 caractères.</div>';
          return;
        }
        if (pw1 !== pw2) {
          formMsg.innerHTML = '<div class="msg error">Les deux mots de passe ne correspondent pas.</div>';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Enregistrement…';
        try {
          await confirmPasswordReset(auth, oobCode, pw1);
          content.innerHTML = `
            <div class="msg success">Mot de passe mis à jour avec succès.</div>
            <p class="hint" style="margin-top:0">Vous pouvez maintenant retourner sur l'application Mojammaa Connect et vous connecter avec votre nouveau mot de passe.</p>
          `;
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Enregistrer';
          const code = err && err.code;
          let text = "Une erreur est survenue. Réessayez.";
          if (code === 'auth/expired-action-code') text = "Ce lien a expiré. Demandez un nouveau lien depuis l'application.";
          if (code === 'auth/invalid-action-code') text = "Ce lien n'est plus valide. Demandez un nouveau lien depuis l'application.";
          if (code === 'auth/weak-password') text = "Mot de passe trop faible (minimum 6 caractères).";
          formMsg.innerHTML = `<div class="msg error">${text}</div>`;
        }
      });
    }

    async function init() {
      if (mode !== 'resetPassword' || !oobCode) {
        renderError("Lien invalide ou incomplet. Demandez un nouveau lien depuis l'application.");
        return;
      }
      try {
        const email = await verifyPasswordResetCode(auth, oobCode);
        renderForm(email);
      } catch (err) {
        const code = err && err.code;
        if (code === 'auth/expired-action-code') {
          renderError("Ce lien a expiré. Demandez un nouveau lien depuis l'application.");
        } else if (code === 'auth/invalid-action-code') {
          renderError("Ce lien n'est plus valide (déjà utilisé ou incorrect). Demandez un nouveau lien depuis l'application.");
        } else {
          renderError("Impossible de vérifier ce lien. Réessayez ou demandez un nouveau lien.");
        }
      }
    }

    init();
  </script>
</body>
</html>
